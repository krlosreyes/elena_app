name: elena_app
description: "Sistema de Alineación Biológica - MVP"
publish_to: "none"
version: 1.0.0+38

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  state_notifier: ^1.0.0

  # Navigation
  go_router: ^17.1.0

  # Backend
  firebase_core: ^4.5.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_app_check: ^0.4.1+5
  firebase_crashlytics: ^5.0.0 # SPEC-80: observabilidad de crashes (mobile only)
  firebase_analytics: ^12.0.0 # SPEC-193: analytics de negocio + eventos de conducta (mobile)

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1 # Versión estable
  json_annotation: ^4.9.0    # Versión estable

  # Security & UI
  # SEC-04 (auditoría 2026-07-11): flutter_secure_storage se retiró — 0 usos
  # reales en lib/. Los datos hoy en SharedPreferences (flags de tour,
  # timestamp de bloqueo biométrico) no son sensibles per se, y los tokens
  # de sesión los maneja Firebase Auth directamente vía Keychain/Keystore
  # nativo, sin pasar por Dart. Si en el futuro se agrega algo genuinamente
  # sensible client-side (PIN de app-lock, token de terceros, etc.),
  # reintroducir esta dependencia en ESE momento en vez de mantenerla sin uso.
  permission_handler: ^12.0.1
  logger: ^2.4.0
  shared_preferences: ^2.5.4
  flutter_local_notifications: ^21.0.0
  purchases_flutter: ^10.2.2 # SPEC-196: infra de cobro (RevenueCat)
  flutter_svg: ^2.2.4
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2

  # SPEC-132: Apple HealthKit (iOS) + Google Health Connect (Android).
  # carp.dk maintainer, MIT, plugin más estable del ecosistema.
  health: ^13.3.1
  purchases_ui_flutter: ^10.2.2

  # SPEC-238: deep-link a apps externas (Samsung Health, Health Connect).
  url_launcher: ^6.3.1
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.1
  freezed: ^2.4.7 # Versión estable compatible con annotation 2.4.1
  json_serializable: ^6.8.0
  firebase_auth_mocks: ^0.15.1
  fake_cloud_firestore: ^4.1.0+1
  # TEST-04 (auditoría pre-producción 2026-07-11): smoke test en
  # integration_test/. Paquete del SDK de Flutter, no requiere versión.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/nutrition/
